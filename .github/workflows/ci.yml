# The rule this enforces (CLAUDE.md): the library AND every example
# build on all three platforms on every push, and the surface gates
# run everywhere. Runners have no GPU — the headless checks SKIP with
# the reason named; the build and the gates are the substance.
name: CI
on: [push, pull_request]
# A newer push supersedes the still-running CI of the ones before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must cost minutes, not hours: the default job cap is
    # six hours, and compute minutes are a budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SDL3 + MoltenVK (brew)
        if: runner.os == 'macOS'
        run: brew install sdl3 molten-vk

      - name: SDL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
             libxfixes-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev
             libdrm-dev libgbm-dev mesa-vulkan-drivers libvulkan1 gdb
             vulkan-validationlayers

      - name: SDL3 cache
        if: runner.os != 'macOS'
        id: sdl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/sdl3-prefix
          key: sdl3-3.2.30-${{ runner.os }}

      - name: SDL3 (source build)
        if: runner.os != 'macOS' && steps.sdl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch release-3.2.30 \
              https://github.com/libsdl-org/SDL sdl-src
          cmake -S sdl-src -B sdl-src/build -DCMAKE_BUILD_TYPE=Release \
                -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-prefix"
          cmake --build sdl-src/build -j 4 --config Release
          cmake --install sdl-src/build --config Release

      - name: configure
        shell: bash
        run: |
          PP=""
          [ "$RUNNER_OS" != "macOS" ] && PP="$GITHUB_WORKSPACE/sdl3-prefix"
          CMAKE_PREFIX_PATH="$PP" cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build library + every example
        run: cmake --build build -j 4 --config Release

      - name: lint (surface hygiene)
        shell: bash
        run: sh tools/lint.sh

      # A runner has no display, so SDL_INIT_VIDEO needs the offscreen
      # driver before it can bring a GPU device up at all. ctest hides
      # a skipping test's output, so run one check directly first: its
      # own sentence says why, at the cost of a few milliseconds.
      # slangc for the Linux leg: decouple_check compiles a kernel, and
      # the one leg with a device must RUN the decoupling gate rather
      # than skip it. Prebuilt release, cached by version; gpud finds it
      # through GPUD_SLANGC.
      - name: slangc (Linux)
        if: runner.os == 'Linux'
        env:
          SLANG_VERSION: 2026.16.1
        run: |
          set -e
          PREFIX="$GITHUB_WORKSPACE/slang-prefix"
          if [ ! -x "$PREFIX/bin/slangc" ]; then
            mkdir -p "$PREFIX"
            curl -sSL -o slang.tar.gz \
              "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-linux-x86_64.tar.gz"
            tar -xzf slang.tar.gz -C "$PREFIX"
          fi
          "$PREFIX/bin/slangc" -v || true
          echo "GPUD_SLANGC=$PREFIX/bin/slangc" >> "$GITHUB_ENV"

      - name: device probe (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          # offscreen, not dummy: the dummy driver implements no Vulkan
          # loading, so SDL_GPU finds no backend through it — which is
          # what the probe finally said out loud.
          SDL_VIDEODRIVER: offscreen
          GPUD_LOG: "1"
        run: |
          ls -la /usr/share/vulkan/icd.d/ || true
          # Diagnostic, not a gate — the gates step below is the one
          # that can fail. The tolerance is deliberate: this check
          # exits 77 when no device comes up, which is a SKIP, and a
          # skip must not fail a diagnostic.
          ./build/tests/gpud_check || true
          # A check that segfaults on the runner and nowhere else: its
          # backtrace, since no debugger can be attached here. Never a
          # gate — the gates step below is.
          for c in resize_check; do
            gdb -batch -ex run -ex bt --args ./build/tests/$c 2>&1 | tail -40 || true
          done

      # Lavapipe (in mesa-vulkan-drivers) is a software Vulkan device,
      # so the Linux leg actually DRAWS: the shot checks assert pixels,
      # and a test that skips proves nothing. Where no device comes up
      # the checks still SKIP by name — never a silent pass.
      - name: gates (tests + installed surface)
        env:
          VK_ICD_FILENAMES: ${{ runner.os == 'Linux' && '/usr/share/vulkan/icd.d/lvp_icd.json' || '' }}
          VK_DRIVER_FILES: ${{ runner.os == 'Linux' && '/usr/share/vulkan/icd.d/lvp_icd.json' || '' }}
          SDL_VIDEODRIVER: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
          # The leg with a device runs VALIDATED: the Khronos layer
          # (apt's vulkan-validationlayers) with synchronization
          # validation, aborting on the first error — a red job, not a
          # line in a log. Lavapipe is one shared queue, so the
          # cross-queue edge is not represented here; decouple_check
          # gates that functionally, and the two-queue drill is local.
          SIMVIEW_VVL: ${{ runner.os == 'Linux' && 'sync,abort' || '' }}
          # Every wait bounded, ours and gpud's: a hang is a sentence
          # and a red test, not a job that runs into --timeout.
          SIMVIEW_WAIT_MS: "20000"
          # gpud says why a device did not come up; SDL says what it
          # tried. Cheap, and the only view into a runner we cannot
          # attach a debugger to.
          GPUD_LOG: "1"
          SDL_LOGGING: "1"
        # --timeout names the hanging test instead of stalling the job.
        run: ctest --test-dir build --output-on-failure -C Release --timeout 120

